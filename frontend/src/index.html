<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DMIS Tanzania</title>
  <base href="/">
  <link rel="icon" type="image/png" href="images/emblem.png">
  <!-- All third-party assets are vendored under /vendor (frontend/public/vendor) so the system is
       fully self-contained — no CDN/internet dependency (fonts and icons previously dropped out
       intermittently when fonts.googleapis.com / cdnjs were unreachable). -->
  <link href="/vendor/inter/inter.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.css">
  <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <script src="/vendor/leaflet/leaflet.js"></script>
  <link rel="stylesheet" href="/vendor/leaflet-draw/leaflet.draw.css" />
  <script src="/vendor/leaflet-draw/leaflet.draw.js"></script>
  <!-- Early font-scale apply (before Angular boot) so size preference does not flash default. -->
  <script>
    (function () {
      try {
        var k = 'dmis.fontRootPx';
        var v = localStorage.getItem(k);
        var n = v == null ? 19 : parseInt(v, 10);
        if (!isFinite(n)) n = 19;
        if (n < 15) n = 15;
        if (n > 24) n = 24;
        document.documentElement.style.fontSize = n + 'px';
        document.documentElement.style.setProperty('--fs-root', n + 'px');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
