# Frontend edge inside the Docker network.
# Proxies API and EW PDF generate path. TLS terminates at Caddy (prod) or host reverse proxy.

upstream dmis_backend {
    server backend:8080;
}

upstream dmis_ew_pdf {
    server ew-pdf:8600;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;

    # SPA: client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot context-path /api
    location /api/ {
        proxy_pass http://dmis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Bulletin PDF engine (same path the Angular app uses: /ew-api/generate/…)
    location /ew-api/ {
        proxy_pass http://dmis_ew_pdf/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }
}
