# Frontend edge inside the Docker network.
# Proxies API and EW PDF generate path. TLS terminates at Caddy (prod) or host reverse proxy.

upstream dmis_backend {
    server backend:8080;
}

upstream dmis_ew_pdf {
    server ew-pdf:8600;
}

# Preserve WebSocket upgrades while closing ordinary upstream HTTP connections cleanly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 12m;

    # Enforced even when this container is exposed behind an edge other than the bundled Caddy.
    # Angular component styles require style-src 'unsafe-inline'; executable code remains same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://gibs.earthdata.nasa.gov https://wvs.earthdata.nasa.gov https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self'; frame-src blob: https://www.youtube-nocookie.com https://www.sat24.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Authenticated REST/SSE invalidation. Buffering would turn sub-second wake-ups into delayed
    # batches; 11 minutes exceeds the server's forced 10-minute re-authentication cut.
    location = /api/v1/sync/stream {
        proxy_pass http://dmis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_connect_timeout 10s;
        add_header X-Accel-Buffering "no" always;
    }

    # Same GraphQL URL for HTTP queries and authenticated graphql-transport-ws subscriptions.
    # The server forces subscription reconnect before this timeout to revalidate the bearer token.
    location = /api/graphql {
        proxy_pass http://dmis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_connect_timeout 10s;
    }

    # Spring Boot context-path /api
    location /api/ {
        proxy_pass http://dmis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Bulletin PDF engine (same path the Angular app uses: /ew-api/generate/…)
    location /ew-api/ {
        proxy_pass http://dmis_ew_pdf/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }
}
