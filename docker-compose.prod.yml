# Production overlay — immutable image tags, required secrets, TLS edge, no weak defaults.
#
# Usage (on the server, after images are pulled):
#   export DMIS_IMAGE_TAG=2026.07.14   # or git SHA
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This overlay alone does NOT certify go-live. Sign docs/go-live/04-ACCEPTANCE.md.

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set to a strong secret (no default on public edge)}
    # Database stays on the private network only.
    ports: !reset []
    restart: unless-stopped

  backend:
    image: ${DMIS_IMAGE_BACKEND:?set DMIS_IMAGE_BACKEND e.g. registry.example/emaafa/dmis-backend:2026.07.14}
    build: !reset null
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DMIS_AUTH_JWT_SECRET: ${DMIS_AUTH_JWT_SECRET:?DMIS_AUTH_JWT_SECRET must be >=32 random bytes}
      DMIS_SECURITY_CORS_ALLOWED_ORIGINS: ${DMIS_SECURITY_CORS_ALLOWED_ORIGINS:?set public SPA origins e.g. https://emaafa.pmo.go.tz}
      DMIS_EW_PDF_HEALTH_URL: http://ew-pdf:8600/health
    # No direct host publish — only via Caddy → frontend → backend.
    ports: !reset []
    restart: unless-stopped

  frontend:
    image: ${DMIS_IMAGE_FRONTEND:?set DMIS_IMAGE_FRONTEND e.g. registry.example/emaafa/dmis-frontend:2026.07.14}
    build: !reset null
    ports: !reset []
    restart: unless-stopped

  ew-pdf:
    image: ${DMIS_IMAGE_EW_PDF:?set DMIS_IMAGE_EW_PDF e.g. registry.example/emaafa/ew-pdf:2026.07.14}
    build: !reset null
    restart: unless-stopped

  # TLS terminator (Let's Encrypt when DMIS_PUBLIC_HOST has public DNS).
  edge:
    image: caddy:2.8-alpine
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DMIS_PUBLIC_HOST: ${DMIS_PUBLIC_HOST:?set public hostname e.g. emaafa.pmo.go.tz}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dmis_net
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
