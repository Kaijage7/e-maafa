# Staging HTTPS without public DNS (Phase E / D4).
#
# Uses Caddy "tls internal" (local CA). Not for production public edge.
#
#   docker compose -f docker-compose.yml -f docker-compose.tls-local.yml up -d
#
# Then:
#   curl -k https://localhost:8443/
#   curl -k https://localhost:8443/api/actuator/health
#
# Browser will warn about the certificate — expected for internal TLS.
# Production: use docker-compose.prod.yml with real DMIS_PUBLIC_HOST + DNS.

services:
  edge:
    image: caddy:2.8-alpine
    depends_on:
      - frontend
    ports:
      # Avoid clashing with host services; map to 8443/8088 by default.
      - "${DMIS_TLS_LOCAL_HTTPS_PORT:-8443}:443"
      - "${DMIS_TLS_LOCAL_HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/caddy/Caddyfile.internal:/etc/caddy/Caddyfile:ro
      - caddy_data_local:/data
      - caddy_config_local:/config
    networks:
      - dmis_net
    restart: unless-stopped

volumes:
  caddy_data_local:
  caddy_config_local:
