spring:
  application:
    name: dmis-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    # Content uploads (news/gallery images) keep their own 5 MB controller check; the container limit is
    # 10 MB so scanned EOCC bulletin PDFs (often 6-8 MB with map imagery) reach the upload controller,
    # which then enforces its own 10 MB cap with a precise message. [auditor A11 GAP-2; EW upload hardening]
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  graphql:
    # The API is available at /api/graphql because the application context path is /api.
    # Keep the browser IDE off by default; clients use the versioned, reviewed schema below.
    http:
      # The request-size and rate-limit guards intentionally protect this exact application path.
      path: /graphql
    websocket:
      # Native clients use the current graphql-transport-ws protocol while foregrounded. The
      # Authorization bearer is required on the HTTP upgrade so the normal JWT denylist and
      # restricted-token filters remain authoritative; connection_init carries no second auth path.
      path: /graphql
      connection-init-timeout: 10s
      keep-alive: 15s
    graphiql:
      enabled: false
    schema:
      # Mobile builds use a reviewed schema artifact. Production schema discovery stays closed;
      # explicitly enable it only in a controlled development/code-generation environment.
      introspection:
        enabled: ${DMIS_GRAPHQL_INTROSPECTION_ENABLED:false}
      printer:
        enabled: false

  # SMTP for real email (stakeholder/dissemination notifications). Secrets from the environment.
  # Default host is empty so readiness and MailHealthIndicator stay honest when credentials are deferred.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 15000

  jpa:
    # Flyway owns the schema (DDL); Hibernate only validates the mapping against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Africa/Dar_es_Salaam

  flyway:
    enabled: true
    # `platform` holds Flyway history and shared infrastructure; each bounded context
    # gets its own schema (`registry` is the first). The legacy Laravel `public` tables
    # are never touched by Flyway-owned schema creation.
    schemas: platform,registry,incident,ew,dissemination,notification
    default-schema: platform
    create-schemas: true
    # The shared database already exists (strangler migration); baseline so Flyway
    # only manages the new platform schemas, never the legacy Laravel `public` tables.
    baseline-on-migrate: true
    baseline-version: 0
    # Two agents develop in parallel with RESERVED version blocks (ops V22-V30, public V31+),
    # so a lower-numbered migration can legitimately arrive after a higher one has applied.
    out-of-order: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Documented alternative identity path. The platform mints/validates its own HS256 token
          # (dmis.auth.jwt below); the JwtDecoder bean in JwtSecurityConfig OVERRIDES this issuer, so
          # no Keycloak instance is contacted unless you remove that bean and front the app with one.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/dmis}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    # Surface @Valid field-validation errors so the create forms tell the user WHICH field failed
    # (the auditor's A5 flag: forms fell back to a generic "Could not create…"). Stack traces stay
    # hidden; ResponseStatusException reasons already surface via the ProblemDetail `detail` field.
    include-message: never
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Show component breakdown only when authenticated (ops diagnosis without public leakage).
      show-details: when_authorized
  health:
    # Mail probe needs live SMTP credentials. Leave off until MAIL_HOST + password are set for cutover
    # (readiness board already tracks host presence; controlled test-send proves delivery).
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

springdoc:
  # Publish the OpenAPI document only. The Swagger UI WebJar is intentionally not packaged.
  api-docs:
    path: /v3/api-docs

dmis:
  sync:
    # Cursor history must outlive the longest supported offline window. An older cursor receives
    # HTTP 410 and must rebuild from the GraphQL snapshot; it never gets a deceptive partial suffix.
    retention: ${DMIS_SYNC_RETENTION:90d}
    cleanup-cron: ${DMIS_SYNC_CLEANUP_CRON:0 29 * * * *}
    cleanup-batch-size: ${DMIS_SYNC_CLEANUP_BATCH_SIZE:10000}
    # SSE carries only a wake-up. Ten-minute reconnects revalidate the bearer before its default
    # 30-minute expiry; heartbeat/proxy settings keep carrier and edge connections honest.
    relay-poll-ms: ${DMIS_SYNC_RELAY_POLL_MS:500}
    sse-timeout: ${DMIS_SYNC_SSE_TIMEOUT:10m}
    sse-heartbeat-ms: ${DMIS_SYNC_SSE_HEARTBEAT_MS:15000}
    sse-max-connections: ${DMIS_SYNC_SSE_MAX_CONNECTIONS:5000}
    sse-max-connections-per-actor: ${DMIS_SYNC_SSE_MAX_CONNECTIONS_PER_ACTOR:5}
    # Shared by REST/SSE and GraphQL subscriptions. The WebSocket interceptor refuses new operations
    # on an older socket; subscriptions separately stop at JWT expiry and poll logout revocation.
    graphql-subscription-timeout: ${DMIS_SYNC_GRAPHQL_SUBSCRIPTION_TIMEOUT:10m}
  idempotency:
    # Must be at least as long as the longest supported client/offline retry queue. Receipts contain
    # only the request digest and small response body, never the incident payload or attachment bytes.
    retention: ${DMIS_IDEMPOTENCY_RETENTION:90d}
    # Delete a bounded, lock-skipping batch each hour so cleanup cannot become one unbounded live DB transaction.
    cleanup-cron: ${DMIS_IDEMPOTENCY_CLEANUP_CRON:0 17 * * * *}
    cleanup-batch-size: ${DMIS_IDEMPOTENCY_CLEANUP_BATCH_SIZE:10000}
  graphql:
    # Defense in depth against deeply nested or alias-amplified read operations.
    max-query-depth: ${DMIS_GRAPHQL_MAX_QUERY_DEPTH:8}
    max-query-complexity: ${DMIS_GRAPHQL_MAX_QUERY_COMPLEXITY:100}
    request-timeout: ${DMIS_GRAPHQL_REQUEST_TIMEOUT:20s}
    max-request-bytes: ${DMIS_GRAPHQL_MAX_REQUEST_BYTES:65536}
    # root-fields = only mobileHome/mobileSync/incidentWorkspace roots.
    # document = body must match a SHA-256 in graphql/persisted-operations.json (prod hardening).
    allowlist-enabled: ${DMIS_GRAPHQL_ALLOWLIST_ENABLED:true}
    allowlist-mode: ${DMIS_GRAPHQL_ALLOWLIST_MODE:root-fields}
    require-named-operations: ${DMIS_GRAPHQL_REQUIRE_NAMED_OPERATIONS:false}
    # An established WebSocket bypasses servlet-filter dispatch for subsequent operations, so it has
    # its own per-actor operation budget in the GraphQL interceptor chain.
    websocket-max-operations: ${DMIS_GRAPHQL_WEBSOCKET_MAX_OPERATIONS:300}
    websocket-operation-window-seconds: ${DMIS_GRAPHQL_WEBSOCKET_OPERATION_WINDOW_SECONDS:60}
    # End active subscriptions promptly after logout rather than waiting for JWT/socket expiry.
    websocket-revocation-check: ${DMIS_GRAPHQL_WEBSOCKET_REVOCATION_CHECK:5s}
  security:
    # Keycloak realm roles live under this JWT claim path.
    roles-claim-path: realm_access.roles
    # Emergency only: allow non-local start with open demo accounts (default refuse).
    allow-demo-accounts-in-prod: ${DMIS_ALLOW_DEMO_ACCOUNTS_IN_PROD:false}
  # Self-issued bearer token (login mints, resource server validates — see JwtSecurityConfig).
  auth:
    jwt:
      # dmis.auth.jwt.secret is intentionally NOT set here. In a non-local profile it MUST be
      # provided via env DMIS_AUTH_JWT_SECRET (>= 32 bytes) or startup fails fast; under the local
      # profile a bundled dev default is used. (Relaxed binding maps DMIS_AUTH_JWT_SECRET -> this key.)
      issuer: ${DMIS_AUTH_JWT_ISSUER:dmis}
      # VAPT iii: access-token lifetime (was 720 → 120 → 60 → 30). Client idle logout + POST /v1/auth/logout
      # denylist (jti) close the practical session window; full OAuth refresh-token design is optional later.
      ttl-minutes: ${DMIS_AUTH_JWT_TTL_MINUTES:30}
      # Limited-purpose tokens (password_change / mfa_enroll) expire faster.
      limited-ttl-minutes: ${DMIS_AUTH_JWT_LIMITED_TTL_MINUTES:15}
    # Optional ops-configured system actor for scheduled jobs (email of a real Super Admin).
    # Empty = resolve Super Admin by role only. Never hardcode demo emails in non-local code paths.
    system-actor-email: ${DMIS_AUTH_SYSTEM_ACTOR_EMAIL:}
  # F59 delivery retry (failed/pending SMS + email). Cap retries; DLR still comes from webhook.
  delivery:
    retry-enabled: ${DMIS_DELIVERY_RETRY_ENABLED:true}
    max-retries: ${DMIS_DELIVERY_MAX_RETRIES:3}
    retry-delay-ms: ${DMIS_DELIVERY_RETRY_DELAY_MS:120000}
  # M-Gov SMS gateway (the proven national delivery path). Secrets come from the environment.
  mgov:
    url: ${MGOV_SMS_URL:https://mgov.gov.go.tz/gateway/sms/v2/send-sms}
    # Optional shared secret for POST /v1/webhooks/mgov/dlr (empty = accept any in local).
    dlr-secret: ${DMIS_MGOV_DLR_SECRET:}
    api-key: ${MGOV_API_KEY:}
    system-id: ${MGOV_SYSTEM_ID:}
    mobile-service-id: ${MGOV_MOBILE_SERVICE_ID:}
    # Must be a sender ID registered/whitelisted with M-Gov. 15200 is registered; alphanumeric
    # "e-MAAFA" needs PMO ICT to register it with M-Gov first (else 48231 SENDER NOT REGISTERED).
    sender-id: ${MGOV_SENDER_ID:15200}
  # Email sender identity (Gmail SMTP). From-address falls back to spring.mail.username.
  mail:
    from-name: ${MAIL_FROM_NAME:e-MAAFA DMIS}
  # File storage (bulletin PDFs, publications, uploads). Docker mounts a named volume here.
  # Env: DMIS_STORAGE_PUBLIC_ROOT  (default: ./storage/public under process cwd)
  storage:
    public-root: ${DMIS_STORAGE_PUBLIC_ROOT:${user.dir}/storage/public}
  # EW bulletin PDF sidecar health (Docker: http://ew-pdf:8600/health). Env: DMIS_EW_PDF_HEALTH_URL
  ew:
    pdf-health-url: ${DMIS_EW_PDF_HEALTH_URL:http://127.0.0.1:8600/health}
  # Careful cutover residual accept flags (ops sign-off only — never invent live national systems).
  # Env: DMIS_GO_LIVE_ACCEPT_SMS_DEFERRED / _EMAIL_DEFERRED / _SPARSE_PHONES / _PDF_SIDECAR / _STORAGE_PARTIAL
  go-live:
    accept-sms-deferred: ${DMIS_GO_LIVE_ACCEPT_SMS_DEFERRED:false}
    accept-email-deferred: ${DMIS_GO_LIVE_ACCEPT_EMAIL_DEFERRED:false}
    accept-sparse-phones: ${DMIS_GO_LIVE_ACCEPT_SPARSE_PHONES:false}
    accept-pdf-sidecar: ${DMIS_GO_LIVE_ACCEPT_PDF_SIDECAR:false}
    accept-storage-partial: ${DMIS_GO_LIVE_ACCEPT_STORAGE_PARTIAL:false}
  # Exercise inject scheduler — off by default (enable only for deliberate drill windows).
  scenario-injects:
    enabled: ${DMIS_SCENARIO_INJECTS_ENABLED:false}
    poll-ms: ${DMIS_SCENARIO_INJECTS_POLL_MS:60000}
